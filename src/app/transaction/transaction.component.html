<div class="transaction-container">
    <h1 class="transfer-title">Listado de Transferencias</h1>
  
    <!-- Botón de nueva transferencia que redirige a newTransaction -->
    <div class="button-container">
        <button class="btn" [routerLink]="['/newTransaction']">Nueva Transferencia</button>
    </div>
  
    <!-- Tabla de transacciones -->
    <div class="table-container">
      <table class="transaction-table">
        <thead>
          <tr>
            <th>Origen</th>
            <th>Destino</th>
            <th>Monto</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let transaction of transactions">
            <td>{{ transaction.originCard }} - {{ transaction.nameOriginCard }}</td>
            <td>{{ transaction.destinyCard }} - {{ transaction.nameDestinyCard }}</td>
            <td [class.credit]="transaction.credit">{{ transaction.amount | currency:'USD' }}</td>
            <td>{{ transaction.dateTime | date:'MM/dd/yy, HH:mm' }}</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
